version: "3.9"

services:
  iris:
    build:
      context: ./iris
      dockerfile: Dockerfile
      args:
        IRIS_IMAGE: intersystemsdc/irishealth-community:preview
    image: iris-global-guard:latest
    container_name: iris
    command: --check-caps false
    ports:
      - "52773:52773"
      - "1972:1972"
    networks:
      - iris-net
    healthcheck:
      test: ["CMD", "iris", "list"]
      interval: 20s
      timeout: 10s
      retries: 10

  quarkus-orm:
    build:
      context: ./quarkus-orm/quard-ia
      dockerfile: Dockerfile
    image: quarkus-orm:latest
    container_name: quarkus-orm
    depends_on:
      iris:
        condition: service_healthy
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      QUARKUS_PROFILE: dev
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:IRIS://iris:1972/%SYS
      QUARKUS_DATASOURCE_USERNAME: _SYSTEM
      QUARKUS_DATASOURCE_PASSWORD: SYS
    ports:
      - "8080:8080"
    networks:
      - iris-net
    restart: unless-stopped

networks:
  iris-net:
    driver: bridge